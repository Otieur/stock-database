version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: cscc43-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cscc43
      POSTGRES_USER: cscc43
      POSTGRES_PASSWORD: cscc43
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
